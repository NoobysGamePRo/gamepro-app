script: "Beta/gen_6_oras_xy/oras_horde_encounter.py"
name: "ORAS – Horde Encounter"
game: "Omega Ruby / Alpha Sapphire (3DS)"
console: "3DS"
draft: true
kind: "wild encounters"
start_state: "ORAS: saved where hordes appear, Sweet Scent user in slot 2"
cycles: 10
timeout_minutes: 30
cycle_log: "Horde \\#\\S+: not shiny \u2014 fleeing"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over a wild Pokemon sprite"}
interactive:            # a headless run must answer these
  - "line 157: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "Horde \\#\\S+: not shiny — fleeing"}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "a wild Pokemon on the battle screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every encounter is detected, judged not shiny and fled, then walking resumes in the same area. Different species must NOT be reported as shiny. Plus one proof that detection works."
notes: "Flees with Up, A (the XY horde script uses Down, Right, A); colour baseline breaks if the horde species changes. Overlaps horde_encounters (Release) which says it also works in ORAS - consider retiring this one."
# log lines that mean it found its target:
#   Script paused — catch your shiny! Press ■ Stop when done.
#   *** SHINY HORDE POKEMON! Encounter #{} R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
