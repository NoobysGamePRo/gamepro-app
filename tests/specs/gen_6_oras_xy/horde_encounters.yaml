script: "Beta/gen_6_oras_xy/horde_encounters.py"
name: "XY - Horde Encounter"
game: "X / Y (3DS) — also works in ORAS"
console: "3DS"
draft: true
kind: "wild encounters"
start_state: "X/Y or ORAS: saved where hordes appear, Sweet Scent user first in party, light sensor on the bottom screen"
cycles: 10
timeout_minutes: 30
cycle_log: "Encounter \\#\\S+: not shiny \\("
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "corners", prompt: "Click the 4 corners of the 3DS screen"}
interactive:            # a headless run must answer these
  - "line 168: parks until Stop is pressed (stop_event.wait())"
  - "asks the user to press Stop within a time window (baseline check)"
checkpoints:
  - name: "checked screen"
    when: {log: "Encounter \\#\\S+: not shiny \\("}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "a wild Pokemon on the battle screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every encounter is detected, judged not shiny and fled, then walking resumes in the same area. Different species must NOT be reported as shiny. Plus one proof that detection works."
notes: "Exact duplicate of Release/gen_6_oras_xy/horde_encounters.py - customers see it twice. Remove the Beta copy. Removed in gamepro-scripts PR #3."
# log lines that mean it found its target:
#   *** SHINY DETECTED! Encounter #{} — {}s >= {}s ***
#   Script paused — catch your shiny! Press Stop when done.
