script: "Beta/gen_6_oras_xy/oras_breeding.py"
name: "ORAS - Egg Breeding"
game: "Omega Ruby / Alpha Sapphire (3DS)"
console: "3DS"
draft: true
kind: "breeding / hatching"
start_state: "ORAS: saved on Route 117 facing the Day Care man, Mach Bike on Y"
cycles: 3
timeout_minutes: 30
cycle_log: "Egg \\#\\S+: not shiny \u2014 continuing\\."
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over hatchling sprite"}
interactive:            # a headless run must answer these
  - "line 193: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "Egg \\#\\S+: not shiny — continuing\\."}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "the hatchling (or egg) the script is checking"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each cycle collects or hatches the expected eggs and checks every hatchling; the party/boxes end in the state the script expects."
notes: "Simplified rewrite (collect 1 egg, hatch, check, reset) instead of the C++ box-based batch flow (0.16). Verify the flow or re-port."
# log lines that mean it found its target:
#   Script paused — enjoy your shiny! Press Stop when done.
#   *** SHINY HATCHLING! Egg #{} R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
