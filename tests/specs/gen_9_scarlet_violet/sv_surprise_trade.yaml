script: "Beta/gen_9_scarlet_violet/sv_surprise_trade.py"
name: "SV – Surprise Trade"
game: "Scarlet / Violet (Nintendo Switch)"
console: "Switch"
draft: true
kind: "online trade"
start_state: "SV: Poke Portal reachable with Y, trade Pokemon in Box 1"
cycles: 3
timeout_minutes: 30
cycle_log: "Trade \\#\\S+ complete\\."
max_static_seconds: 120
checkpoints:
  - name: "cycle end"
    when: {log: "Trade \\#\\S+ complete\\."}   # the end of each cycle
    per_cycle: 1
    expect: "the trade finished and the game back at the trade menu"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each trade completes and the next one starts from the same screen."
notes: "Blind fixed waits; the C++ used the camera."
