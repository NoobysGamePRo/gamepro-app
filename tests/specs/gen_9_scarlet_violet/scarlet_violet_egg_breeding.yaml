script: "Beta/gen_9_scarlet_violet/scarlet_violet_egg_breeding.py"
name: "Scarlet / Violet – Egg Breeding"
game: "Scarlet / Violet (Nintendo Switch)"
console: "Switch"
draft: true
kind: "breeding / hatching"
start_state: "SV: in a picnic with two compatible Pokemon, facing the basket"
cycles: 3
timeout_minutes: 30
cycle_log: "egg\\s*\\#(\\d+)"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw rectangle over the picnic basket / egg notification area"}
checkpoints:
  - name: "overview"
    when: {every_minutes: 10}   # no log line marks the check - only the overview frames
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each cycle collects or hatches the expected eggs and checks every hatchling; the party/boxes end in the state the script expects."
notes: "Collects eggs only (no shiny check). time.sleep(5) ignores Stop. BUG: egg check read the BGR frame as RGB (looked for cyan, never fired) - fixed in gamepro-scripts PR #3."
