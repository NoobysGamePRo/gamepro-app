script: "Beta/gen_7_sun_moon/battle_royal_bps.py"
name: "USUM – Battle Royal BP Farm"
game: "Ultra Sun / Ultra Moon (3DS)"
console: "3DS"
draft: true
kind: "item / BP farm"
start_state: "USUM: saved at the Battle Royal Dome desk, 3 Pokemon with Explosion first"
cycles: 5
timeout_minutes: 30
cycle_log: "Battle\\s*\\#(\\d+)"
max_static_seconds: 120
checkpoints:
  - name: "cycle end"
    when: {log: "Battle\\s*\\#(\\d+)"}   # the end of each cycle
    per_cycle: 1
    expect: "back at the start position, the reward counter higher"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each loop completes and the counter (money, balls, BP) changes as expected; the game ends where it started."
notes: "Same presses (0.93) but fixed waits replace the light-sensor checks (blind)."
