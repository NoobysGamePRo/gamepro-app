script: "Beta/gen_8_bdsp/bdsp_shiny_starter.py"
name: "BDSP – Shiny Starter"
game: "Brilliant Diamond / Shining Pearl (Nintendo Switch)"
console: "Switch"
draft: true
kind: "soft-reset hunt"
start_state: "BDSP: saved at the entrance to Lake Verity before the cutscene"
cycles: 5
timeout_minutes: 30
cycle_log: ""
max_static_seconds: 120
calibration:            # answered from the rig profile in a headless run
  - {mode: "rect", prompt: "Draw rectangle over the dialogue / text area", rig_key: "TODO"}
interactive:            # a headless run must answer these
  - "line 151: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "encounter"
    when: "TODO: log line or minutes"
    expect: "the target Pokemon on screen at the moment the shiny check runs"
  - name: "after reset"
    when: "TODO: log line or minutes"
    expect: "the game back at the title / save point, ready for the next cycle"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Restarts with Z (HOME+A+B on Switch, not a restart). A text timeout counts as shiny (false stop). Starter is a code constant. Restart + timeout fixed in gamepro-scripts PR #4."
