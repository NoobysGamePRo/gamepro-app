script: "Beta/gen_8_sword_shield/sword_shield_shiny_regi.py"
name: "SwSh - Shiny Regi"
game: "Sword / Shield (Nintendo Switch)"
console: "Switch"
draft: true
kind: "soft-reset hunt"
start_state: "SwSh: saved in front of the Regi statue"
cycles: 5
timeout_minutes: 30
cycle_log: "No shiny\\. Soft reset \\#\\S+\\.\\.\\."
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over Regi sprite"}
interactive:            # a headless run must answer these
  - "line 176: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "No shiny\\. Soft reset \\#\\S+\\.\\.\\."}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "the target Pokemon on screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Correct Switch restart. Colour on a 3D sprite (Regis' shiny colours differ strongly)."
# log lines that mean it found its target:
#   Script paused — catch your shiny! Press Stop when done.
#   *** SHINY REGI! R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
