script: "Beta/gen_8_sword_shield/stationary_encounter.py"
name: "Sword / Shield – Stationary Encounter"
game: "Sword / Shield (Nintendo Switch)"
console: "Switch"
draft: true
kind: "soft-reset hunt"
start_state: "SwSh: saved in front of the stationary Pokemon"
cycles: 5
timeout_minutes: 30
cycle_log: "battle\\ loaded\\ in\\s*(\\d+)"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw rectangle over the dialogue / text area"}
  - {mode: "rect", prompt: "Draw rectangle over the battle name box"}
interactive:            # a headless run must answer these
  - "line 109: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "SR \\#\\S+: battle loaded in"}   # the timing check result
    per_cycle: 1
    expect: "the target Pokemon on screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Restarts with Z (not a restart on Switch). Battle-box timeout counts as shiny (false stop). Restart + timeout fixed in gamepro-scripts PR #4."
# log lines that mean it found its target:
#   *** SHINY DETECTED! Time: {} ms ***
