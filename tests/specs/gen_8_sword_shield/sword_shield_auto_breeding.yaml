script: "Beta/gen_8_sword_shield/sword_shield_auto_breeding.py"
name: "SwSh - Auto Breeding"
game: "Sword / Shield (Nintendo Switch)"
console: "Switch"
draft: true
kind: "breeding / hatching"
start_state: "SwSh: see the script header (Route 5 Nursery)"
cycles: 3
timeout_minutes: 30
cycle_log: ""
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over hatchling sprite"}
interactive:            # a headless run must answer these
  - "line 365: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "overview"
    when: {every_minutes: 10}   # no log line marks the check - only the overview frames
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each cycle collects or hatches the expected eggs and checks every hatchling; the party/boxes end in the state the script expects."
notes: "Close port (0.63 due to joystick moves). Uses controller._send('9'/'r') for the NE joystick - works, should become controller methods."
# log lines that mean it found its target:
#   Egg hatched while walking! Total hatched: {}
#   Egg hatched while walking! Total hatched: {}
#   Egg hatched! Total hatched: {}
#   Egg hatched! Total hatched: {}
