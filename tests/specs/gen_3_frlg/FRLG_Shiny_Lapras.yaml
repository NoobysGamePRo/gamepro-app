script: "Release/gen_3_frlg/FRLG_Shiny_Lapras.py"
name: "FRLG Shiny Lapras"
game: "FireRed / LeafGreen (NSO GBA)"
console: "Switch"
draft: false
kind: "soft-reset hunt"
start_state: "FRLG (NSO): one Pokemon in the party, saved in Silph Co. directly above the employee who gives Lapras, facing down. GBA app is the first HOME tile, no system update pending."
cycles: 5
timeout_minutes: 30
cycle_log: "Attempt\\s*(\\d+)"
max_static_seconds: 120
target_log: "DETECTED!"
calibration:            # corners: detected automatically, the rig's corners.default as backup
  - {mode: "corners", prompt: "Click the 4 corners of the Switch / Switch 2 screen"}
interactive:            # a headless run must answer these
  - "after DETECTED! it parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "Watching\\.\\.\\. \\S+ px match", delay_seconds: 1}
    per_cycle: 1
    expect: "Lapras's summary screen (party slot 2); the star region left of the Pokemon's name is empty for a normal Lapras"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
detection_proof:
  reference_image: "Shiny_Images/FRLG Lapras.png"
  result: "DETECT_1_REGION [0.415, 0.215, 0.053, 0.080] scores 46 px on the real shiny (also with +/-6 px shifts) vs threshold 10; a normal Lapras scores 0 (gamepro-scripts PR #8, 2026-11-16)"
success: "Every cycle restarts the game, receives Lapras, opens its summary and logs 'Watching... 0 px' with no DETECTED! Plus the detection proof above."
notes: "Script Builder recording. Switch restart HOME, X, A. Shiny star colour check after 4-corner calibration. Validated 2026-11-13: 2 x 5 headless cycles, no false shinies."
