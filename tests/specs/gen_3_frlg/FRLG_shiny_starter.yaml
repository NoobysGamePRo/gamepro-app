script: "Release/gen_3_frlg/FRLG_shiny_starter.py"
name: "FRLG Shiny Starter"
game: "FireRed / LeafGreen (NSO GBA)"
console: "Switch"
draft: true
kind: "soft-reset hunt"
start_state: "FRLG (NSO): saved in Oak's lab facing the chosen starter's Poke Ball"
cycles: 5
timeout_minutes: 30
cycle_log: "Attempt\\s*(\\d+)"
target_log: "DETECTED!"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "corners", prompt: "Click the 4 corners of the 3DS screen"}
  - {mode: "rect", prompt: "Draw a box around the shiny star area."}
interactive:            # a headless run must answer these
  - "line 180: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "Watching\\.\\.\\. \\S+ px match", delay_seconds: 1}   # the watch starts as the screen opens; 1 s later it has settled
    per_cycle: 1
    expect: "the target Pokemon on screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Script Builder recording, same pattern as Lapras. DESCRIPTION says 3DS but it is the Switch/NSO version. Text fixed in gamepro-scripts PR #3."
