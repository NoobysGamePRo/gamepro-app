cycles: 5
timeout_minutes: 30
cycle_log: "Attempt\\s*(\\d+)"
max_static_seconds: 120
calibration:            # answered from the rig profile in a headless run
  - {mode: "corners", prompt: "Click the 4 corners of the 3DS screen", rig_key: "TODO"}
  - {mode: "rect", prompt: "Draw a box around the shiny star area.", rig_key: "TODO"}
interactive:            # a headless run must answer these
  - "line 180: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "encounter"
    when: "TODO: log line or minutes"
    expect: "the target Pokemon on screen at the moment the shiny check runs"
  - name: "after reset"
    when: "TODO: log line or minutes"
    expect: "the game back at the title / save point, ready for the next cycle"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Script Builder recording, same pattern as Lapras. DESCRIPTION says 3DS but it is the Switch/NSO version. Text fixed in gamepro-scripts PR #3."
