script: "Beta/gen_4_hgss_dpp/platinum_shiny_riolu.py"
name: "Platinum - Shiny Riolu"
game: "Platinum (DS via 3DS)"
console: "3DS (DS mode)"
draft: true
kind: "breeding / hatching"
start_state: "Platinum: saved on Iron Island facing Riley (egg gift)"
cycles: 3
timeout_minutes: 30
cycle_log: "Soft\\ reset\\s*\\#(\\d+)"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over Riolu's sprite"}
interactive:            # a headless run must answer these
  - "line 226: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "No shiny\\. Soft reset \\#\\S+\\.\\.\\."}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "the hatchling (or egg) the script is checking"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each cycle collects or hatches the expected eggs and checks every hatchling; the party/boxes end in the state the script expects."
notes: "New simplified flow (walk loop + colour) instead of the C++ (0.24). Single species so colour is fine; flow needs a hardware check."
# log lines that mean it found its target:
#   Script paused — enjoy your shiny! Press Stop when done.
#   *** SHINY RIOLU! R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
