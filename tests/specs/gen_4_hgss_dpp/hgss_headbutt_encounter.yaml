script: "Beta/gen_4_hgss_dpp/hgss_headbutt_encounter.py"
name: "HGSS – Headbutt Encounter"
game: "HeartGold / SoulSilver (DS / 3DS)"
console: "3DS (DS mode)"
draft: true
kind: "wild encounters"
start_state: "HGSS: saved facing a Headbutt tree"
cycles: 10
timeout_minutes: 30
cycle_log: "Encounter \\#\\S+ detected!"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over the wild Pokemon's sprite"}
interactive:            # a headless run must answer these
  - "line 174: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "Encounter \\#\\S+: R:"}   # logged with the colour values of each check
    per_cycle: 1
    expect: "a wild Pokemon on the battle screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every encounter is detected, judged not shiny and fled, then walking resumes in the same area. Different species must NOT be reported as shiny. Plus one proof that detection works."
notes: "Colour baseline from the first wild Pokemon - a different species reads as shiny. C++ used light-sensor timing (species independent)."
# log lines that mean it found its target:
#   *** SHINY DETECTED! R:{} G:{} B:{} ***
#   Script paused — catch your shiny! Press ■ Stop when done.
