script: "Beta/gen_2_vc/crystal_shiny_eevee.py"
name: "Crystal - Shiny Eevee"
game: "Crystal (3DS Virtual Console)"
console: "3DS"
draft: true
kind: "soft-reset hunt"
start_state: "Crystal VC: saved facing Bill in his house in Goldenrod"
cycles: 5
timeout_minutes: 30
cycle_log: "Soft\\ reset\\s*\\#(\\d+)"
max_static_seconds: 120
calibration:            # answered from the rig profile in a headless run
  - {mode: "rect", prompt: "Draw region over Eevee's sprite", rig_key: "TODO"}
interactive:            # a headless run must answer these
  - "line 192: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "encounter"
    when: "TODO: log line or minutes"
    expect: "the target Pokemon on screen at the moment the shiny check runs"
  - name: "after reset"
    when: "TODO: log line or minutes"
    expect: "the game back at the title / save point, ready for the next cycle"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Close port (sequence 0.86). Colour check of Eevee on the summary screen (2D GBC sprite: OK). Needs one manual calibration on the summary screen."
# log lines that mean it found its target:
#   Script paused — catch your shiny! Press Stop when done.
#   *** SHINY EEVEE! R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
