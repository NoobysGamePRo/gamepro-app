script: "Beta/gen_2_vc/crystal_shiny_celebi.py"
name: "VC Crystal – Shiny Celebi"
game: "Crystal Virtual Console (3DS)"
console: "3DS"
draft: true
kind: "soft-reset hunt"
start_state: "Crystal VC: saved in front of the GS Ball shrine in Ilex Forest"
cycles: 5
timeout_minutes: 30
cycle_log: "SR \\#\\S+: timed out \u2014 retrying"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw rectangle over the battle text box"}
interactive:            # a headless run must answer these
  - "line 81: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "SR \\#\\S+: text appeared in"}   # the timing check result
    per_cycle: 1
    expect: "the target Pokemon on screen, where the script checks its colour"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Every cycle resets, reaches the encounter/gift and logs \"not shiny\" with the screen showing the expected Pokemon. Plus one proof that detection works: a shiny reference frame, or the check value moving clearly when the target is not on screen."
notes: "Skips the 8 A presses through the GS Ball event that the C++ makes. Detection fires on any dark pixels in the text box from the A press with a fixed 2200 ms - the event dialogue box triggers it. C++: wait for battle blackout, then time to battle text; threshold = first encounter + 800 ms."
# log lines that mean it found its target:
#   *** SHINY CELEBI! Timing: {} ms (threshold: {} ms) ***
