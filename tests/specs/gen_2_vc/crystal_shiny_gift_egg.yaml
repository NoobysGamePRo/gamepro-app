script: "Beta/gen_2_vc/crystal_shiny_gift_egg.py"
name: "Crystal - Shiny Gift Egg"
game: "Crystal (3DS Virtual Console)"
console: "3DS"
draft: true
kind: "breeding / hatching"
start_state: "Crystal VC: saved in front of the Day Care woman in Goldenrod, ready to receive the Odd Egg"
cycles: 3
timeout_minutes: 30
cycle_log: "Soft\\ reset\\s*\\#(\\d+)"
max_static_seconds: 120
calibration:            # corners: detected automatically; rects: answered from the rig profile
  - {mode: "rect", prompt: "Draw region over the hatched Pokemon's sprite"}
interactive:            # a headless run must answer these
  - "line 217: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "checked screen"
    when: {log: "No shiny\\. Soft reset \\#\\S+\\.\\.\\."}   # the not-shiny line, logged straight after the check
    per_cycle: 1
    expect: "the hatchling (or egg) the script is checking"
  - name: "overview"
    when: {every_minutes: 10}
    expect: "the game running the script's loop, not stuck on a menu, error or HOME screen"
success: "Each cycle collects or hatches the expected eggs and checks every hatchling; the party/boxes end in the state the script expects."
notes: "Baseline is one hatchling's colours but the Odd Egg hatches into 7 species - any other species reads as shiny. C++ looked for the shiny STAR on the summary screen. Walking/party flow also differs from the C++ (0.32)."
# log lines that mean it found its target:
#   Script paused — enjoy your shiny! Press Stop when done.
#   *** SHINY HATCHLING! R:{} G:{} B:{}  (baseline R:{} G:{} B:{}) ***
