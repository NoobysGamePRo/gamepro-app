script: "Beta/gen_2_vc/random_encounter.py"
name: "VC Gen 2 – Random Encounter"
game: "Gold / Silver Virtual Console (3DS)"
console: "3DS"
draft: true
kind: "wild encounters"
start_state: "Gold/Silver VC: saved in tall grass, healthy lead"
cycles: 10
timeout_minutes: 30
cycle_log: "Encounter\\s*(\\d+)"
max_static_seconds: 120
calibration:            # answered from the rig profile in a headless run
  - {mode: "rect", prompt: "Draw rectangle over the battle text box area", rig_key: "TODO"}
interactive:            # a headless run must answer these
  - "line 87: parks until Stop is pressed (stop_event.wait())"
  - "line 125: parks until Stop is pressed (stop_event.wait())"
checkpoints:
  - name: "encounter"
    when: "TODO: log line or minutes"
    expect: "a wild Pokemon on the battle screen when the check runs"
  - name: "after flee"
    when: "TODO: log line or minutes"
    expect: "back in the overworld at the same spot"
success: "Every encounter is detected, judged not shiny and fled, then walking resumes in the same area. Different species must NOT be reported as shiny. Plus one proof that detection works."
notes: "Uses one rectangle for both the blackout and the text, so the timing is ~0 ms every time. Flees with a single B (does not run in Gen 2). C++: blackout then timed text with a Run sequence."
# log lines that mean it found its target:
#   *** SHINY! Encounter took {} ms ({} ms above normal) ***
#   *** SHINY! Encounter took {} ms ({} ms above normal) ***
